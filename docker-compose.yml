# Run from the repo root:  docker compose up -d --build
# Setup:                   cp .env.example .env && cp api/.env.example api/.env
services:
  db:
    image: postgres:17-alpine
    container_name: handwritten-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handwritten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handwritten}
      POSTGRES_DB: ${POSTGRES_DB:-handwritten}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./datasets/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handwritten} -d ${POSTGRES_DB:-handwritten}"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build: ./datasets/loader
    container_name: handwritten-loader
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-handwritten}:${POSTGRES_PASSWORD:-handwritten}@db:5432/${POSTGRES_DB:-handwritten}
    volumes:
      - ./data:/data
    restart: "no"
    command:
      - sh
      - -c
      - python generate_fake_data.py --out /data && python load_to_postgres.py --csv /data/bloomerang_export_fake.csv --history-csv /data/past_notes_fake.csv

  api:
    build:
      context: ./api
    container_name: handwritten-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    # These override api/.env (hostnames differ inside the compose network)
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-handwritten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handwritten}
      POSTGRES_DB: ${POSTGRES_DB:-handwritten}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount source for hot reload
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Lets Linux hosts reach host Ollama via host.docker.internal
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./web
    container_name: handwritten-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      # SSR calls the API over the compose network; the browser uses PUBLIC_API_BASE_URL
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # Mount source for hot reload; keep node_modules from the image
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  # Optional: run Ollama in a container
  #   docker compose --profile ollama up -d
  #   root .env: OLLAMA_BASE_URL_DOCKER=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    container_name: handwritten-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
  web_node_modules:
